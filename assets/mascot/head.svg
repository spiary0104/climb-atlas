<svg xmlns="http://www.w3.org/2000/svg" viewBox="212 44 610 610" role="img" aria-label="Bouldeer deer">
<!--
  Bouldeer deer head (docs/DESIGN.md sec. 12.1 asset 1, colour version): the character peeking over its holds boulder,
  hooves on the rim. Flat-vector trace of the source artwork design/mascot/deer/head-on-boulder.png in the same
  1024px coordinate space (Brand Pass 2026-09-26: head outline, forehead spots and the cream muzzle re-measured from
  the source; colours sampled from it). Cropped at the rim for small sizes. Uses: START (44px), default avatar and seal
  (32px), app icon and favicon compositions (icons/). The outline is slightly heavier than the source (9 vs about 7
  units) so it holds at 32px.
  Artwork colours: outline #171B16, fawn #DD9F53, cream #FAE9C7, antler/hoof #754D33, hold green #40634B,
  hold mustard #D5A431, boulder #FAECCD.
-->
